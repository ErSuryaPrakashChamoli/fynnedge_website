[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Nothing else processes the queue in this image, and QUEUE_CONNECTION is
# `database`. Without this program a Filament CSV import is enqueued and then
# sits forever: the admin sees a successful upload, the imports row keeps
# processed_rows=0, and no error is logged anywhere. Queued mail and
# notifications stall the same way.
#
# Runs as www-data so anything it writes under storage/ stays writable by
# php-fpm. --max-time recycles the worker hourly so a deploy's new code is
# picked up and memory use stays bounded; stopwaitsecs lets an in-flight
# import chunk finish instead of being killed mid-row on restart.
[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
